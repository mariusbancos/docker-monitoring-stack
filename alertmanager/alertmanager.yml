# Alert routing. Out of the box alerts are visible in the Alertmanager UI and
# Grafana but not sent anywhere: uncomment one or more integrations under the
# "default" receiver. Secrets live in alertmanager/secrets/ (git-ignored).
route:
  receiver: default
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # --- Slack: put the incoming webhook URL in secrets/slack_webhook_url
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
    #     channel: "#alerts"
    #     send_resolved: true
    #     title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    #
    # --- Telegram: put the bot token in secrets/telegram_bot_token
    # telegram_configs:
    #   - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
    #     chat_id: 123456789
    #     send_resolved: true
    #
    # --- Email: put the SMTP password in secrets/smtp_password
    # email_configs:
    #   - to: ops@example.com
    #     from: alerts@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: alerts@example.com
    #     auth_password_file: /etc/alertmanager/secrets/smtp_password
    #     send_resolved: true

inhibit_rules:
  # A critical alert silences the matching warning for the same host.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, host]
  # When a host is down, don't also page for everything else on it.
  - source_matchers: [alertname="HostDown"]
    target_matchers: [severity=~"warning|critical"]
    equal: [host]
