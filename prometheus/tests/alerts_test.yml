# Run with: promtool test rules prometheus/tests/alerts_test.yml
rule_files:
  - ../rules/hosts.yml
  - ../rules/databases.yml

evaluation_interval: 1m

tests:
  - name: host goes down
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="10.0.1.10:9100", host="web-1"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 5m
        alertname: HostDown
        exp_alerts:
          - exp_labels: { severity: critical, job: node, instance: "10.0.1.10:9100", host: web-1 }
            exp_annotations:
              summary: "web-1 is unreachable"
              description: "node-exporter on 10.0.1.10:9100 has not answered for 2 minutes."

  - name: disk almost full, read-only filesystems ignored
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="web-1", mountpoint="/", fstype="ext4"}'
        values: '5x15'
      - series: 'node_filesystem_size_bytes{host="web-1", mountpoint="/", fstype="ext4"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="web-1", mountpoint="/", fstype="ext4"}'
        values: '0x15'
      - series: 'node_filesystem_avail_bytes{host="web-1", mountpoint="/snap", fstype="ext4"}'
        values: '0x15'
      - series: 'node_filesystem_size_bytes{host="web-1", mountpoint="/snap", fstype="ext4"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="web-1", mountpoint="/snap", fstype="ext4"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels: { severity: critical, host: web-1, mountpoint: /, fstype: ext4 }
            exp_annotations:
              summary: "web-1: / is over 90% full"
              description: "Only 5% free on /."

  - name: redis memory without maxmemory does not alert
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{host="cache"}'
        values: '95x15'
      - series: 'redis_memory_max_bytes{host="cache"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisMemoryNearLimit
        exp_alerts: []

  - name: mongodb secondary falls behind
    interval: 1m
    input_series:
      # optimeDate is in milliseconds; the secondary stops advancing at minute 2
      - series: 'mongodb_members_optimeDate{host="db", instance="exp:9216", rs_nm="rs0", member_idx="db-1:27017", member_state="PRIMARY"}'
        values: '0+60000x12'
      - series: 'mongodb_members_optimeDate{host="db", instance="exp:9216", rs_nm="rs0", member_idx="db-2:27017", member_state="SECONDARY"}'
        values: '0+60000x2 120000x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: MongoDBReplicationLag
        exp_alerts: []
      - eval_time: 10m
        alertname: MongoDBReplicationLag
        exp_alerts:
          - exp_labels: { severity: warning, host: db, instance: "exp:9216", rs_nm: rs0, member_idx: "db-2:27017", member_state: SECONDARY }
            exp_annotations:
              summary: "db: secondary db-2:27017 is 8m 0s behind"
              description: "Replication lag above 30 seconds for 5 minutes."
