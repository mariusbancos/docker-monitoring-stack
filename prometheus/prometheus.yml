global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The monitoring stack itself
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { host: monitoring }
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { host: monitoring }
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
        labels: { host: monitoring }
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels: { host: monitoring }

  # Servers and services: edit the files in targets/. Prometheus picks up
  # changes automatically, no restart needed.
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.yml]
  - job_name: mongodb
    file_sd_configs:
      - files: [/etc/prometheus/targets/mongodb.yml]
  - job_name: redis
    file_sd_configs:
      - files: [/etc/prometheus/targets/redis.yml]
  - job_name: postgres
    file_sd_configs:
      - files: [/etc/prometheus/targets/postgres.yml]
  - job_name: rabbitmq
    file_sd_configs:
      - files: [/etc/prometheus/targets/rabbitmq.yml]
