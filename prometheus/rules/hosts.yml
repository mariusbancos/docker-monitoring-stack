groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }} is unreachable"
          description: "node-exporter on {{ $labels.instance }} has not answered for 2 minutes."

      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*|nsfs"} < 0.10
          and node_filesystem_readonly == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.mountpoint }} is over 90% full"
          description: "Only {{ $value | humanizePercentage }} free on {{ $labels.mountpoint }}."

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*|nsfs"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
          and node_filesystem_readonly == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.mountpoint }} will fill up within 24h"
          description: "At the current growth rate the filesystem runs out of space within a day."

      - alert: HostHighMemoryUsage
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: memory usage above 90%"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: the kernel killed a process (OOM)"
          description: "A process was killed for running out of memory in the last 10 minutes."

      - alert: HostHighCpuUsage
        expr: 1 - avg by (host, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}: CPU usage above 90% for 15 minutes"
          description: "CPU usage is {{ $value | humanizePercentage }}."
